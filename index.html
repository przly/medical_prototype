<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Continuous Mental Wellbeing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- HeroUI themes switch on data-theme; follow the system setting. -->
    <script>
      const dark = matchMedia("(prefers-color-scheme: dark)");
      const setTheme = () => (document.documentElement.dataset.theme = dark.matches ? "dark" : "light");
      setTheme();
      dark.addEventListener("change", setTheme);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
